name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install publishing CLI
        run: npm install --global npm@12.2.2 --ignore-scripts
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run CI tests
        run: npm run test:ci
      - name: Validate release and package contents
        run: node scripts/release.cjs --check

      - name: Publish through npm Trusted Publishing
        if: github.event_name == 'release'
        run: node scripts/release.cjs --publish
